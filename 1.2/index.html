<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Grid Mastery</title>
</head>
<body>
    <div class="container">
        <h2>Gallery</h2>
        <div class="gallery">
            <div class="item item-1">
                <img src="https://picsum.photos/300/400" alt="Image 1">
                <span>1</span>
            </div>

            <div class="item item-2">
                <img src="https://picsum.photos/600/200" alt="Image 2">
                <span>2</span>
            </div>

            <div class="item item-3">
                <img src="https://picsum.photos/300/200" alt="Image 3">
                <span>3</span>
            </div>

            <div class="item item-4">
                <img src="https://picsum.photos/300/401" alt="Image 4">
                <span>4</span>
            </div>

            <div class="item item-5">
                <img src="https://picsum.photos/300/202" alt="Image 5">
                <span>5</span>
            </div>

            <div class="item item-6">
                <img src="https://picsum.photos/300/201" alt="Image 6">
                <span>6</span>
            </div>
        </div>
    </div>
</body>
</html>
